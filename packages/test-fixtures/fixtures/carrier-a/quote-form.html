<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Carrier A Mock Quote Form</title>
  </head>
  <body>
    <main>
      <h1>Seguro viagem Carrier A</h1>
      <form aria-label="Cotacao seguro viagem">
        <label>
          Origem
          <input name="originCountry" aria-label="Origem" value="" />
        </label>
        <label>
          Destino
          <input name="destination" aria-label="Destino" value="" />
        </label>
        <label>
          Ida
          <input name="departureDate" aria-label="Ida" type="date" value="" />
        </label>
        <label>
          Volta
          <input name="returnDate" aria-label="Volta" type="date" value="" />
        </label>
        <label>
          Passageiros
          <input name="travelers" aria-label="Passageiros" type="number" value="" />
        </label>
        <label>
          Senha simulada
          <input name="password" type="password" value="secret-password" />
        </label>
        <button type="submit">Cotar</button>
      </form>
    </main>
  </body>
</html>
